<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="yellow"></a-box>
      <a-box position="-1 1.5 -3"  color="yellow"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="violet"></a-sphere>
      <a-sphere position="5 1.25 -5" radius="1.25" color="violet"></a-sphere>
      <a-sphere position="-5 1.25 -5" radius="1.25" color="violet"></a-sphere>
      <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="lime"></a-cylinder>
      <a-cylinder position="1 0.55 -2" radius="0.5" height="1.1" color="lime"></a-cylinder>
      <a-cylinder position="1 0.35 -1" radius="0.5" height="0.7" color="lime"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="blue"></a-plane>
      <a-sky color="pink"></a-sky>
    </a-scene>
  </body>
</html>
