<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>

      <a-entity>
        <a-sphere radius="1" phi-start="0" phi-length="300" side="double"color="yellow" rotation="90 0 180"position="0 1 0"></a-sphere>
        <a-circle color="white" side="double" radius="0.25" position="-0 2 -0.3" rotation="-80 90 0"></a-circle>
        <a-circle color="white" side="double" radius="0.25" position="-0 2 0.3" rotation="-80 90 0"></a-circle>
        <a-circle color="black" side="double" radius="0.05" position="-0 2 0.3" rotation="-80 90 0"></a-circle>
        <a-circle color="black" side="double" radius="0.05" position="-0 2 -0.3" rotation="-80 90 0"></a-circle>

      </a-entity>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
