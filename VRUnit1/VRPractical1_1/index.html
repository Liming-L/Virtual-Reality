<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box class="cars" wireframe="true">
          <a-box width="7" height="1" depth="3.5" position="0 1 0"></a-box>
          <a-box width="3" height="1" depth="3" position="0 2 0"></a-box>
          <a-box width="1.18" height="0.5" depth="2.99" position="1.5 1.8 0" rotation="0 0 -50" color="blue"></a-box>
          <a-box width="1.18" height="0.5" depth="2.99" position="-1.5 1.8 0" rotation="0 0 50" color="blue"></a-box>
          <a-torus position="2.1 0.5 1.6" height="0.5" radius="0.3" color="black"></a-torus>
          <a-torus position="2.1 0.5 -1.6" height="0.5" radius="0.3" color="black"></a-torus>
          <a-torus position="-2.1 0.5 1.6" height="0.5" radius="0.3" color="black"></a-torus>
          <a-torus position="-2.1 0.5 -1.6" height="0.5" radius="0.3" color="black"></a-torus>
          <a-box width="0.15" height="0.4" depth="0.9" position="3.5 1.2 1.2" color="yellow"></a-box>
          <a-box width="0.15" height="0.4" depth="0.9" position="3.5 1.2 -1.2" color="yellow"></a-box>
      </a-box>



      <a-plane position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="grey"></a-plane>
      <a-sky color="black"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
